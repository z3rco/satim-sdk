name: Bug report
description: Report a defect or regression in the SDK
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please redact any credentials, order IDs, or PII from the snippets you paste below.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-paragraph description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands that reproduce the issue.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include stack traces or error messages, with secrets removed.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Deno
        - Cloudflare Workers
        - Vercel / Netlify Edge
        - Other
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: e.g. Node 22.5.0
    validations:
      required: true

  - type: checkboxes
    id: env
    attributes:
      label: Environment checks
      options:
        - label: I am on the latest released version of the SDK
        - label: I have removed all credentials and PII from this report
          required: true
