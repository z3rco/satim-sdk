name: Feature request
description: Propose a new capability or enhancement
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the underlying problem this feature solves? Skip "I want X" — describe the friction.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A rough sketch of the API or behaviour you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you ruled out and why.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This stays within the existing zero-dependency, runtime-agnostic constraints
        - label: I'm willing to open a PR if the maintainers agree on the approach
